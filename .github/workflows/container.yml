name: Build container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: 11scat-web-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install codec test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Lint source and validate deployment scripts
        run: |
          npm run lint
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build and test
        run: |
          mkdir -p codex-generated/ci-trace-fixture
          printf '%s\n' 'synthetic tracing exclusion check' > codex-generated/ci-trace-fixture/fixture.txt
          npm test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify standalone artifact contents
        run: npm run check:artifact

  build-and-push:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine image name
        id: image
        shell: bash
        run: |
          # Keep the package location aligned with the restricted VPS deployer.
          # Transferring the Git repository does not migrate that configuration.
          echo "name=ghcr.io/yuumiqwq/11scat-web" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable and current tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.short_sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Configure restricted deployment SSH key
        shell: bash
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          install -m 0600 deploy/known_hosts ~/.ssh/known_hosts

      - name: Deploy exact SHA image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            root@154.40.47.72 \
            "deploy $GITHUB_SHA $GITHUB_ACTOR"
